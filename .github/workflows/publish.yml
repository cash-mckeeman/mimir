name: Publish

# A pushed tag publishes: vX.Y.0 every package in `mix publish_order`, in order;
# <package>-vX.Y.Z one package's patch. A manual dispatch is always a dry run: the
# guard runs every check against the given tag name and commit, and nothing publishes.
# Publishing authenticates to hex.pm with the job's OIDC token; there is no stored key.
on:
  push:
    tags: ["v*", "*-v*"]
  workflow_dispatch:
    inputs:
      tag: {description: "Tag name to evaluate (dry run)", required: true}
      sha: {description: "Commit the tag would name", required: true}

permissions:
  contents: read
  checks: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.guard.outputs.version }}
      packages: ${{ steps.guard.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.sha || github.sha }}
      - uses: erlef/setup-beam@v1
        with: {elixir-version: "1.20", otp-version: "29"}
      - name: hex supports workload identity
        run: bash .github/scripts/hex_workload_identity.sh
      - id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
          SHA: ${{ inputs.sha || github.sha }}
        run: bash .github/scripts/publish_guard.sh

  publish:
    needs: guard
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # hex.pm trusts this repository's publish.yml running in the prod
    # environment (workload identity): no stored key. Only this job may mint the
    # OIDC token. The job-level block replaces the workflow-level one, so it
    # restates what the job reads.
    environment: prod
    permissions:
      contents: read
      checks: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with: {elixir-version: "1.20", otp-version: "29"}
      - name: hex supports workload identity
        run: bash .github/scripts/hex_workload_identity.sh
      - env:
          VERSION: ${{ needs.guard.outputs.version }}
          PACKAGES: ${{ needs.guard.outputs.packages }}
        run: |
          read -r -a packages <<< "$PACKAGES"
          bash .github/scripts/publish.sh "$VERSION" "${packages[@]}"
